<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShiaoYoung 的个人导航：校园服务、学术写作、开发学习、AI 助手与日常工具。">
    <meta name="theme-color" content="#1f604b">
    <title>ShiaoYoung · 导航</title>
    <script>
        (() => {
            try {
                if (localStorage.getItem("shiaoyoung.homepage.theme.v1") === "sdu-red") {
                    document.documentElement.dataset.theme = "sdu-red";
                }
            } catch { /* Keep the default theme when storage is unavailable. */ }
            // Disable restored positions and stale anchors before the page is rendered.
            if ("scrollRestoration" in history) history.scrollRestoration = "manual";

            const showPageTop = () => {
                if (location.hash) {
                    const url = new URL(location.href);
                    url.hash = "";
                    history.replaceState(history.state, "", url.href);
                }
                window.scrollTo(0, 0);
            };

            showPageTop();
            window.addEventListener("pageshow", showPageTop);
        })();
    </script>
    <link rel="stylesheet" href="./assets/styles.css?v=20261113-themes2">
    <script src="./assets/navigation.js?v=20261113-themes2" defer></script>
</head>

<body>
    <div class="forest-background" aria-hidden="true"></div>
    <a class="skip-link" href="#main">跳到导航内容</a>

    <div class="page-shell">
        <div class="theme-toolbar">
            <button id="theme-toggle" class="settings-action theme-toggle" type="button"
                aria-label="山大红主题" aria-pressed="false">山大红</button>
        </div>
        <header class="page-header">
            <h1><a href="https://shiaoyoung.github.io" target="_blank" rel="noopener noreferrer"
                    aria-label="打开 ShiaoYoung 的主页（新标签页）">ShiaoYoung</a><span>·导航</span></h1>
        </header>

        <main id="main" tabindex="-1">
            <section class="search-panel" aria-labelledby="search-heading">
                <h2 id="search-heading" class="sr-only">查找站点</h2>
                <form id="search-form" role="search">
                    <label class="sr-only" for="site-search">搜索站点名称、分类或关键词</label>
                    <div class="search-field">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <circle cx="10.5" cy="10.5" r="6.5"></circle>
                            <path d="m16 16 4.5 4.5" stroke-linecap="round"></path>
                        </svg>
                        <input id="site-search" type="search" placeholder="搜索站点、分类或关键词"
                            autocomplete="off" spellcheck="false" aria-controls="directory" aria-describedby="search-status">
                        <button id="clear-search" class="clear-search" type="button" hidden>清空</button>
                    </div>
                </form>
                <p id="search-status" class="search-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
            </section>

            <section id="favorites" class="section-card favorites" aria-labelledby="favorites-heading">
                <div class="section-heading">
                    <h2 id="favorites-heading">常用</h2>
                    <button id="edit-favorites" class="settings-trigger" type="button" aria-haspopup="dialog"
                        aria-controls="favorites-settings">设置</button>
                </div>
                <ul id="favorite-links" class="link-grid"></ul>
                <p id="favorites-empty" class="favorites-empty" hidden>尚未添加常用站点。</p>
            </section>

            <div id="directory" class="directory"></div>

            <section id="empty-state" class="section-card empty-state" aria-labelledby="empty-heading" hidden>
                <h2 id="empty-heading">没有找到相关站点</h2>
                <button id="reset-search" class="reset-search" type="button">清空搜索，查看全部</button>
            </section>

            <noscript>
                <p class="section-card">请启用 JavaScript 以显示分类导航和站内搜索。</p>
            </noscript>
        </main>

        <footer class="page-footer">ShiaoYoung 的个人导航 <span aria-hidden="true">·</span> © <span id="year">2026</span></footer>
    </div>

    <dialog id="favorites-settings" class="settings-dialog" aria-labelledby="favorites-settings-title"
        aria-describedby="favorites-settings-help">
        <header class="settings-dialog-header">
            <h2 id="favorites-settings-title" tabindex="-1">常用设置</h2>
            <button id="close-favorites-settings" class="settings-action" type="button" aria-label="关闭常用设置">关闭</button>
        </header>
        <p id="favorites-settings-help" class="settings-help">勾选站点添加到常用，使用上移、下移调整顺序。</p>
        <div class="settings-content">
            <section class="settings-panel" aria-labelledby="selected-favorites-heading">
                <h3 id="selected-favorites-heading" tabindex="-1">常用顺序 <span id="selected-favorites-count"></span></h3>
                <ol id="selected-favorites" class="selected-favorites"></ol>
                <p id="selected-favorites-empty" class="settings-empty" hidden>尚未选择站点。</p>
            </section>
            <section class="settings-panel" aria-labelledby="available-favorites-heading">
                <h3 id="available-favorites-heading">选择站点</h3>
                <label class="sr-only" for="favorites-filter">筛选可选站点</label>
                <input id="favorites-filter" class="favorites-filter" type="search" placeholder="筛选站点"
                    autocomplete="off" spellcheck="false" aria-controls="favorite-options">
                <div id="favorite-options" class="favorite-options"></div>
                <p id="favorite-options-empty" class="settings-empty" hidden>没有匹配的站点。</p>
            </section>
        </div>
        <p id="favorites-settings-error" class="settings-error" role="alert" hidden></p>
        <footer class="settings-dialog-footer">
            <button id="restore-favorites" class="settings-action" type="button">恢复默认</button>
            <div class="settings-footer-actions">
                <button id="cancel-favorites-settings" class="settings-action" type="button">取消</button>
                <button id="save-favorites" class="settings-action settings-primary" type="button">保存</button>
            </div>
        </footer>
    </dialog>
</body>

</html>
