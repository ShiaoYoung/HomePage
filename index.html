<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ShiaoYoung 的个人导航：校园服务、学术写作、开发学习、AI 助手与日常工具。">
    <meta name="theme-color" content="#1f604b">
    <title>ShiaoYoung · 导航</title>
    <script>
        (() => {
            // Disable restored positions and stale anchors before the page is rendered.
            if ("scrollRestoration" in history) history.scrollRestoration = "manual";

            const showPageTop = () => {
                if (location.hash) {
                    const url = new URL(location.href);
                    url.hash = "";
                    history.replaceState(history.state, "", url.href);
                }
                window.scrollTo(0, 0);
            };

            showPageTop();
            window.addEventListener("pageshow", showPageTop);
        })();
    </script>
    <link rel="stylesheet" href="./assets/styles.css">
    <script src="./assets/navigation.js" defer></script>
</head>

<body>
    <picture class="forest-background" aria-hidden="true">
        <source media="(max-width: 600px)" srcset="./assets/forest-mobile.webp">
        <img src="./assets/forest-desktop.webp" alt="" fetchpriority="high">
    </picture>
    <a class="skip-link" href="#main">跳到导航内容</a>

    <div class="page-shell">
        <header class="page-header">
            <h1><a href="https://shiaoyoung.github.io" target="_blank" rel="noopener noreferrer"
                    aria-label="打开 ShiaoYoung 的主页（新标签页）">ShiaoYoung</a><span>·导航</span></h1>
        </header>

        <main id="main" tabindex="-1">
            <section class="search-panel" aria-labelledby="search-heading">
                <h2 id="search-heading" class="sr-only">查找站点</h2>
                <form id="search-form" role="search">
                    <label class="sr-only" for="site-search">搜索站点名称、分类或关键词</label>
                    <div class="search-field">
                        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                            <circle cx="10.5" cy="10.5" r="6.5"></circle>
                            <path d="m16 16 4.5 4.5" stroke-linecap="round"></path>
                        </svg>
                        <input id="site-search" type="search" placeholder="搜索站点、分类或关键词"
                            autocomplete="off" spellcheck="false" aria-controls="directory" aria-describedby="search-status">
                        <button id="clear-search" class="clear-search" type="button" hidden>清空</button>
                    </div>
                </form>
                <p id="search-status" class="search-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
            </section>

            <section id="favorites" class="section-card favorites" aria-labelledby="favorites-heading">
                <div class="section-heading">
                    <h2 id="favorites-heading">常用</h2>
                </div>
                <ul id="favorite-links" class="link-grid"></ul>
            </section>

            <div id="directory" class="directory"></div>

            <section id="empty-state" class="section-card empty-state" aria-labelledby="empty-heading" hidden>
                <h2 id="empty-heading">没有找到相关站点</h2>
                <button id="reset-search" class="reset-search" type="button">清空搜索，查看全部</button>
            </section>

            <noscript>
                <p class="section-card">请启用 JavaScript 以显示分类导航和站内搜索。</p>
            </noscript>
        </main>

        <footer class="page-footer">ShiaoYoung 的个人导航 <span aria-hidden="true">·</span> © <span id="year">2026</span></footer>
    </div>
</body>

</html>
